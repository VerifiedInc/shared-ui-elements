name: publish-prerelease

# Publishes a branch to npm under a prerelease dist-tag (beta by default), so a consumer can
# install it fresh: `npm i @verifiedinc-public/shared-ui-elements@beta`. Nothing is committed or
# tagged in git; the version only exists on the registry.
#
# Two ways to run it:
# - Actions tab → Run workflow, on any branch.
# - A PR comment: `/prerelease`, `/prerelease alpha` or `/prerelease rc`. Only users with write
#   access to this repo are honoured, and only for branches of this repo (never forks). The comment
#   job checks nothing out and holds no publish secret: it only dispatches this same workflow on
#   the PR's branch, so publishing always runs as a workflow_dispatch of a branch of this repo.
#   Comment triggers use the workflow file on the default branch.
#
# User-controlled values (inputs, comment text, PR data) only reach shell steps through
# environment variables, never by expression interpolation into `run` blocks.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      preid:
        description: Prerelease id, also used as the npm dist-tag
        type: choice
        default: beta
        options:
          - beta
          - alpha
          - rc
      version:
        description: Full version to publish (optional). Defaults to the next patch of package.json with -<preid>.<run number>
        type: string
        required: false
      pr:
        description: Pull request number to report back to (set by the /prerelease comment; leave empty)
        type: string
        required: false
  issue_comment:
    types: [created]

concurrency:
  group: publish-prerelease-${{ github.ref }}

jobs:
  dispatch-from-comment:
    name: Dispatch from PR comment
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/prerelease')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    steps:
      - name: Validate the request and dispatch the publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)
          case "$PERMISSION" in
            admin|maintain|write) ;;
            *) echo "::error::$AUTHOR has '$PERMISSION' access; write access is required to publish."; exit 1 ;;
          esac

          PREID=$(printf '%s\n' "$COMMENT" | awk 'NR==1 { print ($2 == "" ? "beta" : $2) }')
          case "$PREID" in
            beta|alpha|rc) ;;
            *) echo "::error::Unknown prerelease id '$PREID'. Use /prerelease, /prerelease alpha or /prerelease rc."; exit 1 ;;
          esac

          HEAD=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,isCrossRepository)
          if [ "$(echo "$HEAD" | jq -r .isCrossRepository)" = "true" ]; then
            echo "::error::PR #$PR comes from a fork; prereleases are only published from branches of this repo."
            exit 1
          fi
          BRANCH=$(echo "$HEAD" | jq -r .headRefName)

          gh workflow run publish-prerelease.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            -f "preid=$PREID" -f "pr=$PR"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=rocket --silent

  publish:
    name: Publish prerelease
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate inputs
        env:
          INPUT_PREID: ${{ inputs.preid }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          case "$INPUT_PREID" in
            beta|alpha|rc) ;;
            *) echo "::error::Unknown prerelease id '$INPUT_PREID'."; exit 1 ;;
          esac
          if [ -n "$INPUT_VERSION" ] && ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a valid semver version."
            exit 1
          fi
          if [ -n "$INPUT_PR" ] && ! [[ "$INPUT_PR" =~ ^[0-9]+$ ]]; then
            echo "::error::'$INPUT_PR' is not a pull request number."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.x
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        env:
          PREID: ${{ inputs.preid }}
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
          else
            BASE=$(node -p "require('./package.json').version")
            IFS=. read -r MAJOR MINOR PATCH <<< "${BASE%%-*}"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))-$PREID.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with dist-tag $PREID"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm --no-git-tag-version version "$VERSION"

      - name: Build package
        run: npm run build

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          tag: ${{ inputs.preid }}

      - name: Write install instructions
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREID: ${{ inputs.preid }}
        run: |
          {
            echo "body<<NOTES"
            echo "Published \`@verifiedinc-public/shared-ui-elements@$VERSION\` from \`$GITHUB_REF_NAME\` (\`${GITHUB_SHA::7}\`) with dist-tag \`$PREID\`."
            echo
            echo '```sh'
            echo "npm install @verifiedinc-public/shared-ui-elements@$VERSION"
            echo "# or the moving tag"
            echo "npm install @verifiedinc-public/shared-ui-elements@$PREID"
            echo '```'
            echo "NOTES"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Published \`@verifiedinc-public/shared-ui-elements@$VERSION\`"
            echo
            echo "Branch: \`$GITHUB_REF_NAME\` · Commit: \`${GITHUB_SHA::7}\` · dist-tag: \`$PREID\`"
            echo
            echo '```sh'
            echo "npm install @verifiedinc-public/shared-ui-elements@$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
          BODY: ${{ steps.notes.outputs.body }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Report a failure on the PR
        if: failure() && inputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Prerelease publish failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
