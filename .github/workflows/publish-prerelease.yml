name: publish-prerelease

# Publishes a PR's branch to npm under a prerelease dist-tag (beta by default), so a consumer can
# install it fresh: `npm i @verifiedinc-public/shared-ui-elements@beta`. Nothing is committed or
# tagged in git; the version only exists on the registry.
#
# Trigger: a PR comment `/prerelease`, `/prerelease alpha` or `/prerelease rc`. Only users with
# write access to this repo are honoured, and only for open PRs from branches of this repo (never
# forks), since the build can publish to npm.
#
# Two runs on purpose. npm rejects trusted-publishing tokens from issue_comment runs, so the comment
# run (`request`) never publishes: it filters every other PR comment out, checks the commenter and
# the PR, pins the head commit, and dispatches this same workflow with those values. The dispatched
# run (`publish`) re-checks them and is the one bound to the `npm-prerelease` environment, so
# reviewers are asked to approve a specific commit and never hear about unrelated comments. Both
# runs use the file from the default branch.
#
# User-controlled values (comment text, PR data, dispatch inputs, derived outputs) only reach shell
# steps through environment variables, never by expression interpolation into `run` blocks.

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Publish {0} prerelease of PR #{1} at {2}', inputs.preid, inputs.pr, inputs.sha)
  || github.event.issue.title }}

permissions:
  contents: read

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      sha:
        description: Head commit of the pull request to publish
        required: true
        type: string
      preid:
        description: Prerelease dist-tag
        required: true
        type: choice
        options: [beta, alpha, rc]

concurrency:
  group: publish-prerelease-${{ github.event_name }}-${{ github.event.issue.number || inputs.pr }}

jobs:
  request:
    name: Validate request
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/prerelease')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reacting to a comment on a pull request needs write on pull requests, not only issues.
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Validate the request
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          PR: ${{ github.event.issue.number }}
        run: |
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)
          case "$PERMISSION" in
            admin|maintain|write) ;;
            *) echo "::error::$AUTHOR has '$PERMISSION' access; write access is required to publish."; exit 1 ;;
          esac

          FIRST_LINE=$(printf '%s\n' "$COMMENT" | tr -d '\r' | head -n1)
          if ! [[ "$FIRST_LINE" =~ ^/prerelease([[:space:]]+(beta|alpha|rc))?[[:space:]]*$ ]]; then
            echo "::error::Use /prerelease, /prerelease alpha or /prerelease rc."
            exit 1
          fi
          PREID=${BASH_REMATCH[2]:-beta}

          STATE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,isCrossRepository)
          if [ "$(echo "$STATE" | jq -r .state)" != "OPEN" ]; then
            echo "::error::PR #$PR is not open."
            exit 1
          fi
          if [ "$(echo "$STATE" | jq -r .isCrossRepository)" = "true" ]; then
            echo "::error::PR #$PR comes from a fork; prereleases are only published from branches of this repo."
            exit 1
          fi

          echo "preid=$PREID" >> "$GITHUB_OUTPUT"

      # Pinned before the approval, so what the reviewer approves is exactly what gets built.
      - name: Dispatch the publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          PREID: ${{ steps.request.outputs.preid }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the head commit of PR #$PR."
            exit 1
          fi
          gh workflow run publish-prerelease.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f pr="$PR" -f sha="$SHA" -f preid="$PREID"
          {
            echo "## Prerelease requested"
            echo
            echo "PR: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR · Commit: \`$SHA\` · dist-tag: \`$PREID\`"
            echo
            echo "Approve the \`npm-prerelease\` deployment on the dispatched \"Publish $PREID prerelease of PR #$PR\" run to publish this exact commit."
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=rocket --silent

  publish:
    name: Publish prerelease
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm-prerelease
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # A dispatch can also be started by hand, so its inputs get the same checks as a comment.
      - name: Validate the dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          PREID: ${{ inputs.preid }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{40}$ && "$PREID" =~ ^(beta|alpha|rc)$ ]]; then
            echo "::error::Invalid inputs: pr must be a number, sha a full commit hash, preid beta, alpha or rc."
            exit 1
          fi

          STATE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,isCrossRepository,headRefOid)
          if [ "$(echo "$STATE" | jq -r .state)" != "OPEN" ]; then
            echo "::error::PR #$PR is not open."
            exit 1
          fi
          if [ "$(echo "$STATE" | jq -r .isCrossRepository)" = "true" ]; then
            echo "::error::PR #$PR comes from a fork; prereleases are only published from branches of this repo."
            exit 1
          fi
          if [ "$(echo "$STATE" | jq -r .headRefOid)" != "$SHA" ]; then
            echo "::error::PR #$PR has new commits since the request; comment /prerelease again."
            exit 1
          fi

      - name: Checkout the approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.x

      - name: Resolve version
        id: version
        env:
          PREID: ${{ inputs.preid }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::package.json version '$BASE' is not semver."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${BASE%%-*}"
          VERSION="$MAJOR.$MINOR.$((PATCH + 1))-$PREID.$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with dist-tag $PREID"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm --no-git-tag-version --ignore-scripts version "$VERSION"

      - name: Build package
        run: npm run build

      - name: Publish to npm
        id: publish
        # This run is on the default branch but builds a PR commit, so provenance would attest the wrong commit.
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          access: public
          tag: ${{ inputs.preid }}

      - name: Fail if nothing was published
        if: steps.publish.outputs.type == ''
        run: |
          echo "::error::The registry already has this version, so nothing was published."
          exit 1

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
          VERSION: ${{ steps.version.outputs.version }}
          PREID: ${{ inputs.preid }}
          SHA: ${{ inputs.sha }}
        run: |
          BODY=$(cat <<NOTES
          Published \`@verifiedinc-public/shared-ui-elements@$VERSION\` from \`${SHA::7}\` with dist-tag \`$PREID\`.

          \`\`\`sh
          npm install @verifiedinc-public/shared-ui-elements@$VERSION
          # or the moving tag
          npm install @verifiedinc-public/shared-ui-elements@$PREID
          \`\`\`
          NOTES
          )
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          {
            echo "## Published \`@verifiedinc-public/shared-ui-elements@$VERSION\`"
            echo
            echo "Commit: \`${SHA::7}\` · dist-tag: \`$PREID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failure on the PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Prerelease publish failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
