name: publish-prerelease

# Publishes a branch to npm under a prerelease dist-tag (beta by default), so a consumer can
# install it fresh: `npm i @verifiedinc-public/shared-ui-elements@beta`. Nothing is committed or
# tagged in git; the version only exists on the registry.
#
# Two ways to run it:
# - Actions tab → Run workflow, on any branch.
# - A PR comment: `/prerelease`, `/prerelease alpha` or `/prerelease rc`. Only users with write
#   access to this repo are honoured, and only for branches of this repo (never forks), since the
#   build runs with the npm token. Comment triggers use the workflow file on the default branch.
#
# User-controlled values (inputs, comment text, derived outputs) only reach shell steps through
# environment variables, never by expression interpolation into `run` blocks.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      preid:
        description: Prerelease id, also used as the npm dist-tag
        type: choice
        default: beta
        options:
          - beta
          - alpha
          - rc
      version:
        description: Full version to publish (optional). Defaults to the next patch of package.json with -<preid>.<run number>
        type: string
        required: false
  issue_comment:
    types: [created]

concurrency:
  group: publish-prerelease-${{ github.event.issue.number || github.ref }}

jobs:
  params:
    name: Resolve request
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/prerelease'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      ref: ${{ steps.dispatch.outputs.ref || steps.comment.outputs.ref }}
      preid: ${{ steps.dispatch.outputs.preid || steps.comment.outputs.preid }}
      version: ${{ steps.dispatch.outputs.version }}
      pr: ${{ steps.comment.outputs.pr }}
    steps:
      - name: From the Actions tab
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_PREID: ${{ inputs.preid }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$INPUT_PREID" in
            beta|alpha|rc) ;;
            *) echo "::error::Unknown prerelease id '$INPUT_PREID'."; exit 1 ;;
          esac
          if [ -n "$INPUT_VERSION" ] && ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a valid semver version."
            exit 1
          fi
          {
            echo "ref=$GITHUB_SHA"
            echo "preid=$INPUT_PREID"
            echo "version=$INPUT_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: From a PR comment
        id: comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          PR: ${{ github.event.issue.number }}
        run: |
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)
          case "$PERMISSION" in
            admin|maintain|write) ;;
            *) echo "::error::$AUTHOR has '$PERMISSION' access; write access is required to publish."; exit 1 ;;
          esac

          PREID=$(printf '%s\n' "$COMMENT" | awk 'NR==1 { print ($2 == "" ? "beta" : $2) }')
          case "$PREID" in
            beta|alpha|rc) ;;
            *) echo "::error::Unknown prerelease id '$PREID'. Use /prerelease, /prerelease alpha or /prerelease rc."; exit 1 ;;
          esac

          HEAD=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,isCrossRepository)
          if [ "$(echo "$HEAD" | jq -r .isCrossRepository)" = "true" ]; then
            echo "::error::PR #$PR comes from a fork; prereleases are only published from branches of this repo."
            exit 1
          fi

          {
            echo "ref=$(echo "$HEAD" | jq -r .headRefOid)"
            echo "preid=$PREID"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=rocket --silent

  publish:
    name: Publish prerelease
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.params.outputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.x
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        env:
          PREID: ${{ needs.params.outputs.preid }}
          REQUESTED: ${{ needs.params.outputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
          else
            BASE=$(node -p "require('./package.json').version")
            IFS=. read -r MAJOR MINOR PATCH <<< "${BASE%%-*}"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))-$PREID.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with dist-tag $PREID"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm --no-git-tag-version version "$VERSION"

      - name: Build package
        run: npm run build

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          tag: ${{ needs.params.outputs.preid }}

      - name: Write install instructions
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREID: ${{ needs.params.outputs.preid }}
          REF: ${{ needs.params.outputs.ref }}
        run: |
          {
            echo "body<<NOTES"
            echo "Published \`@verifiedinc-public/shared-ui-elements@$VERSION\` from \`${REF::7}\` with dist-tag \`$PREID\`."
            echo
            echo '```sh'
            echo "npm install @verifiedinc-public/shared-ui-elements@$VERSION"
            echo "# or the moving tag"
            echo "npm install @verifiedinc-public/shared-ui-elements@$PREID"
            echo '```'
            echo "NOTES"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Published \`@verifiedinc-public/shared-ui-elements@$VERSION\`"
            echo
            echo "Commit: \`${REF::7}\` · dist-tag: \`$PREID\`"
            echo
            echo '```sh'
            echo "npm install @verifiedinc-public/shared-ui-elements@$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: needs.params.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.params.outputs.pr }}
          BODY: ${{ steps.notes.outputs.body }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Report a failure on the PR
        if: failure() && needs.params.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.params.outputs.pr }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Prerelease publish failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
