name: Linear Release

# The publish job re-tags with GITHUB_TOKEN, which starts no workflow, so the v tag completes the release under the X.Y.Z name.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  linear-release:
    # ref: https://github.com/VerifiedInc/verified-github-action-workflows
    uses: verifiedinc/verified-github-action-workflows/.github/workflows/linear-release.yml@v1.2.0
    with:
      mode: complete
      strip_v: true
    secrets: inherit
