version: 2.1

orbs:
  unumid: unumid/unumid-app-orb@2.2.3
workflows:
  lint-and-test:
    jobs:
      - unumid/lint-and-test:
          context:
            - Github-Packages
          test_script_name: test
          name: unumid/lint-and-test-branch
          # Babel 8 tooling needs util.styleText (Node >= 20.12); align with the fleet
          node_version: '24.14.1'
          cache_version: v6
          node_version: 26.7.0
          filters:
            branches:
              ignore:
                - main
